name: Build & Release

on:
  push:
    tags:
      - v* # 只在 tag v* 时触发
  workflow_dispatch: # 支持手动触发（仅构建验证，不发 Release）

env:
  NODE_VERSION: 22.x

# 同一个 tag 的发布串行执行，避免并发上传资源产生竞态
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===================================================================
  # 仅构建 Windows x64（本仓库为本地版，只面向 Windows 发布）
  # ===================================================================
  build:
    name: Build on Windows x64
    runs-on: windows-latest
    steps:
      # 检出 Git 仓库
      - name: Check out git repository
        uses: actions/checkout@v6
      # 设置 pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      # 安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      # 设置 Rust（编译任务栏歌词 / SMTC / 本地扫描器原生模块）
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # 清理旧的构建产物
      - name: Clean workspace
        run: |
          Write-Host "🧹 Cleaning workspace, node_modules, and Electron caches..."
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          if (Test-Path out) { Remove-Item -Recurse -Force out }
          if (Test-Path node_modules) { Remove-Item -Recurse -Force node_modules }

          if (Test-Path "$env:LOCALAPPDATA\electron-builder") {
            Remove-Item "$env:LOCALAPPDATA\electron-builder" -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "$env:LOCALAPPDATA\electron") {
            Remove-Item "$env:LOCALAPPDATA\electron" -Recurse -Force -ErrorAction SilentlyContinue
          }

          if (Test-Path "$env:USERPROFILE\.pnpm-store") {
            Remove-Item "$env:USERPROFILE\.pnpm-store" -Recurse -Force -ErrorAction SilentlyContinue
          }

      # 复制环境变量文件
      - name: Copy .env file
        run: |
          if (-not (Test-Path .env)) {
            Copy-Item .env.example .env
          } else {
            Write-Host ".env file already exists. Skipping the copy step."
          }

      # 安装项目依赖
      - name: Install dependencies
        run: pnpm install

      # 构建 Electron App（仅本地构建产物，禁止 electron-builder 自动发布）
      # 注意：electron-builder 26 在 CI 环境会触发“隐式发布”，必须显式传 --publish never
      # （pnpm run 的参数透传在 && 链式脚本中不可靠，因此这里直接调用 electron-builder）
      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          pnpm build
          npx electron-builder --win --config electron-builder.config.ts --x64 --publish never

      # 上传构建产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: SPlayer-Windows-x64
          path: dist/*.*

  # ===================================================================
  # Create & Publish GitHub Release（仅在 tag 推送时执行）
  # ===================================================================
  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # 整理待发布资源
      - name: Prepare release assets
        shell: bash
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/jsyaml" js-yaml@4.1.0
          NODE_PATH="$RUNNER_TEMP/jsyaml/node_modules" \
            node .github/scripts/prepare-release-assets.cjs artifacts release-assets
          echo "待发布资源："
          ls -1 release-assets

      # 用 gh CLI 创建 Draft Release；已存在同名 Release（如手动发布）时跳过，避免覆盖
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          cat > notes.md <<'EOF'
          ## SPlayer 2 · 本地版

          纯本地音乐播放器——已彻底移除全部在线音乐服务，断网全功能可用。

          - 下载 `*-setup.exe`（安装版）或 `*-portable.exe`（便携版），功能一致
          - 移除清单与说明见仓库 [LOCAL-EDITION.md](https://github.com/yUANs404/splayer-2/blob/main/LOCAL-EDITION.md)
          - 本版本基于 SPlayer 3.1.1（AGPL-3.0），感谢原项目作者 imsyy 与所有贡献者

          EOF
          # 重跑保护：已存在同名 Release 时跳过（手动发布的 Release 不会被覆盖）
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过创建（如需重新生成请先删除该 Release）"
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SPlayer 2 · 本地版 $TAG" \
            --notes-file notes.md \
            --verify-tag \
            --draft \
            release-assets/*
